<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Taxi Ledger Pro</title>
  <link rel="manifest" href="./manifest.webmanifest" />

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <style>
    :root {
      --bg: #070a14; --bg2: #0a1022; --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.10); --text: #eef3ff;
      --muted: rgba(238,243,255,.66); --accent: #6aa7ff;
      --accent2: #7c5cff; --ok: #34d399; --danger: #ff5b7a;
      --r20: 20px; --r24: 24px; --shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; color: var(--text); font-family: system-ui, -apple-system, sans-serif; background: var(--bg); overflow-x: hidden; }
    .bg { position: fixed; inset: 0; z-index: -2; background: radial-gradient(1200px 700px at 18% -12%, rgba(106,167,255,.2), transparent 60%), linear-gradient(180deg, #050712 0%, #070a14 100%); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px 14px calc(92px + env(safe-area-inset-bottom)); }
    
    /* UI Components */
    .appbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .logo { width: 44px; height: 44px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-weight: 900; }
    .datePill { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--stroke); }
    input[type="date"] { background: transparent; border: none; color: white; font-weight: 800; outline: none; }
    
    .grid { display: grid; gap: 12px; }
    @media(min-width: 780px) { .grid { grid-template-columns: 1.1fr .9fr; align-items: start; } }
    
    .card { background: var(--card); border: 1px solid var(--stroke); border-radius: var(--r24); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 12px; }
    .cardTitle { padding: 14px; background: rgba(0,0,0,0.15); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--stroke); font-weight: 800; }
    .cardInner { padding: 14px; }
    .badge { font-size: 11px; color: var(--muted); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--stroke); }
    
    /* KPIs */
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .kpi { background: rgba(0,0,0,0.2); padding: 12px; border-radius: var(--r20); border: 1px solid var(--stroke); }
    .kpi .label { font-size: 11px; color: var(--muted); }
    .kpi .val { font-size: 18px; font-weight: 900; margin-top: 4px; }
    .kpi.net .val { color: var(--ok); }

    /* Forms */
    .fieldLabel { font-size: 12px; color: var(--muted); font-weight: 800; margin: 12px 2px 6px; display: block; }
    .field { width: 100%; padding: 14px; border-radius: 16px; background: rgba(0,0,0,0.2); border: 1px solid var(--stroke); color: white; outline: none; font-size: 16px; }
    .btn { width: 100%; padding: 14px; border-radius: 18px; border: 1px solid var(--stroke); font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: white; }
    .btn.ghost { background: rgba(255,255,255,0.05); color: white; }
    .btn.danger { background: rgba(255,91,122,0.1); color: var(--danger); }
    .miniBtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--danger); background: rgba(255,91,122,0.1); cursor: pointer; }
    
    .expense-item { display: grid; grid-template-columns: 1fr 80px 44px; gap: 8px; margin-bottom: 8px; }
    .pill { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; border: 1px solid var(--stroke); display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }

    /* History Items */
    .historyItem { padding: 12px; border: 1px solid var(--stroke); border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; background: rgba(255,255,255,0.03); }
    .historyMeta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .historyNet { font-weight: 900; color: var(--ok); }

    /* Navigation */
    .tabs { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(7,10,20,0.8); backdrop-filter: blur(20px); padding: 12px; display: flex; gap: 8px; border-top: 1px solid var(--stroke); z-index: 100; }
    .tab { flex: 1; padding: 12px; border-radius: 14px; border: none; background: transparent; color: var(--muted); font-weight: 800; cursor: pointer; }
    .tab.active { background: rgba(106,167,255,0.1); color: var(--accent); }
    
    .view { display: none; }
    .view.active { display: block; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; background: #000; padding: 10px 20px; border-radius: 12px; border: 1px solid var(--stroke); display: none; z-index: 1000; }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="wrap">
    
    <header class="appbar">
      <div class="logo">TL</div>
      <div class="datePill">📅 <input id="dateInput" type="date"></div>
    </header>

    <div class="grid">
      <main id="view-entry" class="view active">
        <div class="card">
          <div class="cardTitle">Καταχώρηση <span class="badge" id="autosaveState">έτοιμο</span></div>
          <div class="cardInner">
            <div class="kpis">
              <div class="kpi"><div class="label">Τζίρος</div><div id="kpiRevenue" class="val">0,00 €</div></div>
              <div class="kpi"><div class="label">Extras</div><div id="kpiExtras" class="val">0,00 €</div></div>
              <div class="kpi"><div class="label">Σύνολο</div><div id="kpiTotal" class="val">0,00 €</div></div>
              <div class="kpi net"><div class="label">Καθαρά</div><div id="kpiNet" class="val">0,00 €</div></div>
            </div>

            <label class="fieldLabel">Τζίρος (€)</label>
            <input id="revenue" class="field" inputmode="decimal" type="number" step="0.01">
            <label class="fieldLabel">Μπουρμπουάρ (€)</label>
            <input id="tip1" class="field" inputmode="decimal" type="number" step="0.01">
            <label class="fieldLabel">Άλλα (€)</label>
            <input id="tip2" class="field" inputmode="decimal" type="number" step="0.01">
            
            <label class="fieldLabel">Σύνολο Εξόδων (€)</label>
            <input id="expensesTotal" class="field" readonly value="0.00">
            
            <button id="addExpenseBtn" class="btn ghost" style="margin-top:12px">+ Προσθήκη Εξόδου</button>
            <div id="expensesList" style="margin-top:12px"></div>

            <label class="fieldLabel">Σημειώσεις</label>
            <textarea id="note" class="field" rows="2"></textarea>

            <button id="saveBtn" class="btn primary" style="margin-top:20px">💾 Αποθήκευση</button>

            <div class="card" style="margin-top:24px; background: rgba(0,0,0,0.2);">
              <div class="cardTitle" style="font-size:13px">Google Drive Sync</div>
              <div class="cardInner">
                <div id="syncState" class="pill" style="font-size:11px">🔴 Offline</div>
                <label class="pill" style="cursor:pointer">
                  <span>Auto-sync</span>
                  <input id="syncToggle" type="checkbox">
                </label>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px">
                  <button id="syncLoginBtn" class="btn ghost" style="font-size:12px">Σύνδεση</button>
                  <button id="syncBtn" class="btn ghost" style="font-size:12px">Sync Τώρα</button>
                </div>
                <button id="restoreBtn" class="btn danger" style="margin-top:8px; width:100%; font-size:12px">Επαναφορά (Restore)</button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <section id="view-history" class="view">
        <div class="card">
          <div class="cardTitle">Ιστορικό</div>
          <div class="cardInner" id="historyList"></div>
        </div>
      </section>

      <section id="view-summary" class="view">
        <div class="card">
          <div class="cardTitle">Σύνολα</div>
          <div class="cardInner">
            <div class="pill"><span>Ημέρες</span> <span id="sumDays">0</span></div>
            <div class="pill"><span>Τζίρος</span> <span id="sumRevenue">0,00 €</span></div>
            <div class="pill"><span>Μπουρμπουάρ</span> <span id="sumTip1">0,00 €</span></div>
            <div class="pill"><span>Άλλα</span> <span id="sumTip2">0,00 €</span></div>
            <div class="pill"><span>Έξοδα</span> <span id="sumExpenses">0,00 €</span></div>
            <div class="pill" style="border-color:var(--accent)"><span>Όλα μαζί</span> <span id="sumAllIn">0,00 €</span></div>
            <div class="pill" style="background:var(--ok); color:#000"><span>ΚΑΘΑΡΟ ΚΕΡΔΟΣ</span> <span id="sumNet">0,00 €</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="entry">Εγγραφή</button>
    <button class="tab" data-tab="history">Ιστορικό</button>
    <button class="tab" data-tab="summary">Στατιστικά</button>
  </nav>

  <div id="toast" class="toast"></div>

  <script defer src="./db.js"></script>
  <script defer src="./driveSync.js"></script>
  <script defer src="./app.js"></script>
  <script defer src="./sw.js"></script>
</body>
</html>
