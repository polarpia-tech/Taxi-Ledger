<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Taxi Ledger Pro</title>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  
  <style>
    :root {
      --bg: #070a14;
      --bg2: #0a1022;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.10);
      --text: #eef3ff;
      --muted: rgba(238,243,255,.66);
      --accent: #6aa7ff;
      --accent2: #7c5cff;
      --danger: #ff5b7a;
      --r20: 20px;
      --r24: 24px;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); overflow-x: hidden; min-height: 100vh;
    }

    /* Background Layer */
    .bg {
      position: fixed; inset: 0; z-index: -1;
      background: 
        radial-gradient(1200px 700px at 18% -12%, rgba(106,167,255,.2), transparent 60%),
        radial-gradient(1000px 700px at 88% 2%, rgba(124,92,255,.15), transparent 60%),
        linear-gradient(180deg, #050712 0%, #070a14 100%);
    }

    .wrap {
      max-width: 980px; margin: 0 auto;
      padding: 20px 16px calc(100px + env(safe-area-inset-bottom));
    }

    /* App Bar */
    .appbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center; font-weight: 900;
      box-shadow: 0 8px 20px rgba(106,167,255,0.3);
    }
    .brand h1 { font-size: 20px; margin: 0; }
    .brand p { font-size: 12px; margin: 0; color: var(--muted); }

    .date-input-wrap {
      background: var(--card); border: 1px solid var(--stroke);
      padding: 8px 12px; border-radius: 99px; display: flex; align-items: center; gap: 8px;
    }
    input[type="date"] {
      background: transparent; border: none; color: var(--text); font-weight: bold; outline: none;
    }

    /* Cards & Grid */
    .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media(min-width: 800px) { .grid { grid-template-columns: 1.2fr 0.8fr; } }

    .card {
      background: var(--card); border: 1px solid var(--stroke);
      border-radius: var(--r24); overflow: hidden; backdrop-filter: blur(10px);
    }
    .card-header { padding: 16px; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 16px; }

    /* Inputs */
    .field-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .field {
      width: 100%; padding: 14px; border-radius: 16px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--stroke);
      color: white; font-size: 16px; outline: none; transition: 0.2s;
    }
    .field:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(106,167,255,0.1); }
    .field[readonly] { opacity: 0.6; cursor: not-allowed; }

    /* KPIs */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .kpi { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 16px; border: 1px solid var(--stroke); }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .kpi-val { font-size: 18px; font-weight: 900; margin-top: 4px; }
    .kpi-val.plus { color: #34d399; }

    /* Buttons */
    .btn {
      width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--stroke);
      font-weight: 800; cursor: pointer; transition: transform 0.1s;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; border: none; }
    .btn-ghost { background: rgba(255,255,255,0.05); color: var(--text); }
    .btn-danger { background: rgba(255,91,122,0.1); color: var(--danger); border-color: rgba(255,91,122,0.2); }

    /* Tabs Navigation */
    .tabs {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(7,10,20,0.8); backdrop-filter: blur(20px);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: flex; gap: 8px; border-top: 1px solid var(--stroke); z-index: 100;
    }
    .tab-btn {
      flex: 1; padding: 12px; border-radius: 14px; border: none;
      background: transparent; color: var(--muted); font-weight: 700;
      cursor: pointer; transition: 0.3s;
    }
    .tab-btn.active { background: rgba(106,167,255,0.15); color: var(--accent); }

    .view { display: none; animation: fadeIn 0.3s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Ripple Effect */
    .ripple {
      position: absolute; border-radius: 50%; transform: scale(0);
      animation: ripple-animation 0.6s linear; background: rgba(255,255,255,0.3);
    }
    @keyframes ripple-animation { to { transform: scale(4); opacity: 0; } }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="wrap">
    <header class="appbar">
      <div class="brand">
        <div class="logo">TL</div>
        <div>
          <h1>Taxi Ledger</h1>
          <p>Smart Fleet Management</p>
        </div>
      </div>
      <div class="date-input-wrap">
        <span>📅</span>
        <input type="date" id="dateInput">
      </div>
    </header>

    <div class="grid">
      <section id="view-entry" class="view active">
        <div class="card">
          <div class="card-header">
            <span style="font-weight: 800;">Νέα Καταχώρηση</span>
            <small id="saveStatus" style="color: var(--muted);">Αναμονή...</small>
          </div>
          <div class="card-body">
            <div class="kpi-grid">
              <div class="kpi">
                <div class="kpi-label">Σύνολο (€)</div>
                <div id="kpiTotal" class="kpi-val">0.00</div>
              </div>
              <div class="kpi">
                <div class="kpi-label">Καθαρά (€)</div>
                <div id="kpiNet" class="kpi-val plus">0.00</div>
              </div>
            </div>

            <div class="field-group">
              <label for="revenue">Τζίρος Ταξιμέτρου</label>
              <input type="number" id="revenue" class="field" inputmode="decimal" placeholder="0.00">
            </div>

            <div class="field-group">
              <label for="tips">Μπουρμπουάρ & Extras</label>
              <input type="number" id="tips" class="field" inputmode="decimal" placeholder="0.00">
            </div>

            <div class="field-group">
              <label>Έξοδα Ημέρας</label>
              <input type="number" id="expensesTotal" class="field" readonly value="0.00">
              <button id="addExpenseBtn" class="btn btn-ghost" style="margin-top: 10px; padding: 10px; font-size: 13px;">
                + Προσθήκη Εξόδου
              </button>
            </div>

            <div id="expenseItems"></div>

            <div class="field-group">
              <label for="notes">Σημειώσεις</label>
              <textarea id="notes" class="field" rows="2" placeholder="π.χ. Βροχερή μέρα, κίνηση στην Κηφισίας..."></textarea>
            </div>

            <button id="saveBtn" class="btn btn-primary">💾 Αποθήκευση Δεδομένων</button>
          </div>
        </div>
      </section>

      <section id="view-history" class="view">
        <div class="card">
          <div class="card-header"><span style="font-weight: 800;">Ιστορικό</span></div>
          <div class="card-body" id="historyList">
            <p style="text-align: center; color: var(--muted);">Δεν υπάρχουν δεδομένα.</p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="entry">Εγγραφή</button>
    <button class="tab-btn" data-tab="history">Ιστορικό</button>
    <button class="tab-btn" data-tab="summary">Στατιστικά</button>
  </nav>

  <script>
    // 1. Tab Switching Logic
    const tabs = document.querySelectorAll('.tab-btn');
    const views = document.querySelectorAll('.view');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        views.forEach(v => v.classList.remove('active'));
        
        tab.classList.add('active');
        const target = document.getElementById(`view-${tab.dataset.tab}`);
        if(target) target.classList.add('active');
      });
    });

    // 2. Ripple Effect Logic
    function createRipple(event) {
      const button = event.currentTarget;
      const circle = document.createElement("span");
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - button.offsetLeft - radius}px`;
      circle.style.top = `${event.clientY - button.offsetTop - radius}px`;
      circle.classList.add("ripple");

      const ripple = button.getElementsByClassName("ripple")[0];
      if (ripple) ripple.remove();
      button.appendChild(circle);
    }

    const buttons = document.querySelectorAll('.btn');
    buttons.forEach(b => b.addEventListener('click', createRipple));

    // 3. Basic Calculation Logic
    const revInput = document.getElementById('revenue');
    const tipsInput = document.getElementById('tips');
    const kpiTotal = document.getElementById('kpiTotal');

    function updateKPIs() {
      const rev = parseFloat(revInput.value) || 0;
      const tips = parseFloat(tipsInput.value) || 0;
      kpiTotal.innerText = (rev + tips).toFixed(2) + " €";
    }

    revInput.addEventListener('input', updateKPIs);
    tipsInput.addEventListener('input', updateKPIs);

    // Set today's date
    document.getElementById('dateInput').valueAsDate = new Date();
  </script>
</body>
</html>
