<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Taxi Ledger Pro</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://apis.google.com/js/api.js"></script>

  <style>
    :root {
      --bg: #070a14; --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.10); --text: #eef3ff;
      --muted: rgba(238,243,255,.66); --accent: #6aa7ff;
      --accent2: #7c5cff; --ok: #34d399; --danger: #ff5b7a;
      --r24: 24px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; color: var(--text); font-family: system-ui, sans-serif; background: var(--bg); overflow-x: hidden; padding-bottom: 100px; }
    .bg { position: fixed; inset: 0; z-index: -2; background: radial-gradient(1200px 700px at 18% -12%, rgba(106,167,255,.2), transparent 60%), linear-gradient(180deg, #050712 0%, #070a14 100%); }
    .wrap { max-width: 600px; margin: 0 auto; padding: 18px 14px; }
    .appbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .logo { width: 44px; height: 44px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-weight: 900; }
    .datePill { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--stroke); }
    input[type="date"] { background: transparent; border: none; color: white; font-weight: 800; outline: none; font-size: 16px; }
    .card { background: var(--card); border: 1px solid var(--stroke); border-radius: var(--r24); overflow: hidden; backdrop-filter: blur(15px); margin-bottom: 12px; }
    .cardTitle { padding: 14px; background: rgba(0,0,0,0.15); border-bottom: 1px solid var(--stroke); font-weight: 800; }
    .cardInner { padding: 14px; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .kpi { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 20px; border: 1px solid var(--stroke); }
    .kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .kpi .val { font-size: 18px; font-weight: 900; margin-top: 4px; }
    .kpi.net .val { color: var(--ok); }
    .fieldLabel { font-size: 12px; color: var(--muted); font-weight: 800; margin: 12px 2px 6px; display: block; }
    .field { width: 100%; padding: 14px; border-radius: 16px; background: rgba(0,0,0,0.25); border: 1px solid var(--stroke); color: white; outline: none; font-size: 16px; margin-bottom: 8px; }
    .btn { width: 100%; padding: 16px; border-radius: 18px; border: 1px solid var(--stroke); font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; transition: 0.2s; }
    .btn:active { transform: scale(0.98); opacity: 0.8; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: white; margin-top: 10px; }
    .btn.ghost { background: rgba(255,255,255,0.05); color: white; }
    .tabs { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(7,10,20,0.9); backdrop-filter: blur(20px); padding: 12px; display: flex; gap: 8px; border-top: 1px solid var(--stroke); z-index: 100; }
    .tab { flex: 1; padding: 12px; border-radius: 14px; border: none; background: transparent; color: var(--muted); font-weight: 800; }
    .tab.active { background: rgba(106,167,255,0.15); color: var(--accent); }
    .view { display: none; }
    .view.active { display: block; }
    .historyItem { padding: 14px; border: 1px solid var(--stroke); border-radius: 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: rgba(255,255,255,0.03); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <header class="appbar">
      <div class="logo">TL</div>
      <div class="datePill"><input id="dateInput" type="date"></div>
    </header>

    <main id="view-entry" class="view active">
      <div class="card">
        <div class="cardTitle">Νέα Εγγραφή</div>
        <div class="cardInner">
          <div class="kpis">
            <div class="kpi"><div class="label">Τζίρος</div><div id="kpiRevenue" class="val">0,00 €</div></div>
            <div class="kpi net"><div class="label">Καθαρά</div><div id="kpiNet" class="val">0,00 €</div></div>
          </div>
          <label class="fieldLabel">Τζίρος (€)</label>
          <input id="revenue" class="field" type="number" step="0.01" inputmode="decimal">
          <label class="fieldLabel">Μπουρμπουάρ (€)</label>
          <input id="tip1" class="field" type="number" step="0.01" inputmode="decimal">
          <label class="fieldLabel">Έξοδα (€)</label>
          <input id="expensesTotal" class="field" type="number" step="0.01" inputmode="decimal">
          <button id="saveBtn" class="btn primary">💾 ΑΠΟΘΗΚΕΥΣΗ</button>
        </div>
      </div>
    </main>

    <section id="view-history" class="view">
      <div class="card"><div class="cardTitle">Ιστορικό</div><div class="cardInner" id="historyList"></div></div>
    </section>

    <section id="view-settings" class="view">
      <div class="card">
        <div class="cardTitle">Cloud Sync</div>
        <div class="cardInner">
          <div id="syncState" style="text-align:center; margin-bottom:15px; font-weight:bold; color:var(--danger)">🔴 Offline</div>
          <button id="syncLoginBtn" class="btn ghost" style="margin-bottom:10px">🔑 Σύνδεση Google</button>
          <button id="syncBtn" class="btn ghost">🔄 Συγχρονισμός Τώρα</button>
        </div>
      </div>
    </section>
  </div>

  <nav class="tabs">
    <button class="tab active" onclick="showTab('entry')">Εγγραφή</button>
    <button class="tab" onclick="showTab('history')">Ιστορικό</button>
    <button class="tab" onclick="showTab('settings')">Cloud</button>
  </nav>

  <script src="./db.js"></script>
  <script src="./driveSync.js"></script>
  <script src="./app.js"></script>
</body>
</html>
