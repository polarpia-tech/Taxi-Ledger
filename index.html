<!doctype html>
<html lang="el">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Taxi Ledger Pro</title>
    
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <style>
        :root { --bg: #070a14; --text: #eef3ff; --accent: #6aa7ff; --ok: #34d399; --danger: #ff5b7a; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; padding-bottom: 80px; }
        .wrap { padding: 20px; max-width: 500px; margin: auto; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; margin-bottom: 15px; }
        .field { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-main { background: var(--accent); color: white; }
        .btn-ghost { background: #222; color: #ccc; }
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #0a0a0a; border-top: 1px solid #333; }
        .nav-item { flex: 1; padding: 20px; text-align: center; cursor: pointer; opacity: 0.6; }
        .nav-item.active { opacity: 1; color: var(--accent); border-top: 2px solid var(--accent); }
        .view { display: none; }
        .view.active { display: block; }
        .history-item { border-bottom: 1px solid #222; padding: 10px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="wrap">
        <h2 id="pageTitle">Νέα Εγγραφή</h2>
        <input type="date" id="dateInput" class="field">

        <div id="view-entry" class="view active">
            <div class="card">
                <label>Τζίρος (€)</label>
                <input type="number" id="revenue" class="field" placeholder="0.00" oninput="calculate()">
                <label>Μπουρμπουάρ (€)</label>
                <input type="number" id="tip" class="field" placeholder="0.00" oninput="calculate()">
                <label>Έξοδα (€)</label>
                <input type="number" id="expenses" class="field" placeholder="0.00" oninput="calculate()">
                <hr>
                <h3 style="color:var(--ok)">Καθαρά: <span id="netResult">0.00</span> €</h3>
                <button class="btn btn-main" onclick="handleSave()">💾 ΑΠΟΘΗΚΕΥΣΗ</button>
            </div>
        </div>

        <div id="view-history" class="view">
            <div id="historyList"></div>
        </div>

        <div id="view-settings" class="view">
            <div class="card">
                <p id="syncStatus">Κατάσταση: 🔴 Offline</p>
                <button class="btn btn-ghost" onclick="DriveSync.signIn()">🔑 Σύνδεση Google</button>
                <button class="btn btn-ghost" onclick="DriveSync.syncNow()">🔄 Συγχρονισμός</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="switchView('entry', this)">Εγγραφή</div>
        <div class="nav-item" onclick="switchView('history', this)">Ιστορικό</div>
        <div class="nav-item" onclick="switchView('settings', this)">Cloud</div>
    </div>

    <script>
        // --- 1. DATABASE LOGIC (TaxiDB) ---
        const TaxiDB = {
            dbName: "TaxiDB",
            open: () => new Promise((res, rej) => {
                const req = indexedDB.open("TaxiDB", 1);
                req.onupgradeneeded = () => req.result.createObjectStore("days", {keyPath: "date"});
                req.onsuccess = () => res(req.result);
            }),
            save: async (day) => {
                const db = await TaxiDB.open();
                const tx = db.transaction("days", "readwrite");
                tx.objectStore("days").put(day);
                return new Promise(res => tx.oncomplete = res);
            },
            getAll: async () => {
                const db = await TaxiDB.open();
                return new Promise(res => {
                    db.transaction("days").objectStore("days").getAll().onsuccess = (e) => res(e.target.result);
                });
            }
        };

        // --- 2. APP LOGIC ---
        function calculate() {
            const rev = parseFloat(document.getElementById('revenue').value) || 0;
            const tip = parseFloat(document.getElementById('tip').value) || 0;
            const exp = parseFloat(document.getElementById('expenses').value) || 0;
            document.getElementById('netResult').textContent = (rev + tip - exp).toFixed(2);
        }

        async function handleSave() {
            const day = {
                date: document.getElementById('dateInput').value,
                revenue: parseFloat(document.getElementById('revenue').value) || 0,
                tip: parseFloat(document.getElementById('tip').value) || 0,
                expenses: parseFloat(document.getElementById('expenses').value) || 0,
                net: parseFloat(document.getElementById('netResult').textContent)
            };
            await TaxiDB.save(day);
            alert("Αποθηκεύτηκε! ✅");
        }

        function switchView(viewId, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            el.classList.add('active');
            if(viewId === 'history') loadHistory();
        }

        async function loadHistory() {
            const all = await TaxiDB.getAll();
            const list = document.getElementById('historyList');
            list.innerHTML = all.map(d => `<div class="history-item"><span>${d.date}</span><b>${d.net.toFixed(2)}€</b></div>`).join('');
        }

        document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);

        // --- 3. DRIVE SYNC LOGIC ---
        const DriveSync = {
            accessToken: null,
            signIn: () => {
                const client = google.accounts.oauth2.initTokenClient({
                    client_id: "103553412574-688m910d6596u03b60i4qis7p1f03t5n.apps.googleusercontent.com",
                    scope: "https://www.googleapis.com/auth/drive.appdata",
                    callback: (resp) => {
                        DriveSync.accessToken = resp.access_token;
                        document.getElementById('syncStatus').innerText = "Κατάσταση: 🟢 Online";
                    }
                });
                client.requestAccessToken();
            },
            syncNow: async () => {
                if(!DriveSync.accessToken) return alert("Συνδεθείτε πρώτα!");
                alert("Συγχρονισμός σε εξέλιξη...");
                // Εδώ μπαίνει το API call της Google
            }
        };
    </script>
</body>
</html>
