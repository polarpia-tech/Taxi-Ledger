<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Taxi Ledger Pro</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <script defer src="./db.js"></script>
  <script defer src="./drive-sync.js"></script>
  <script defer src="./app.js"></script>

  <style>
    :root {
      --bg: #070a14;
      --bg2: #0a1022;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.10);
      --text: #eef3ff;
      --muted: rgba(238,243,255,.66);
      --accent: #6aa7ff;
      --accent2: #7c5cff;
      --danger: #ff5b7a;
      --r20: 20px;
      --r24: 24px;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); overflow-x: hidden; min-height: 100vh;
    }

    .bg {
      position: fixed; inset: 0; z-index: -1;
      background: 
        radial-gradient(1200px 700px at 18% -12%, rgba(106,167,255,.2), transparent 60%),
        radial-gradient(1000px 700px at 88% 2%, rgba(124,92,255,.15), transparent 60%),
        linear-gradient(180deg, #050712 0%, #070a14 100%);
    }

    .wrap {
      max-width: 980px; margin: 0 auto;
      padding: 20px 14px calc(100px + env(safe-area-inset-bottom));
    }

    /* App Bar */
    .appbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .logo {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center; font-weight: 900;
      box-shadow: 0 8px 20px rgba(106,167,255,0.3);
    }
    .brand h1 { font-size: 20px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand p { font-size: 11px; margin: 0; color: var(--muted); }

    .datePill {
      background: var(--card); border: 1px solid var(--stroke);
      padding: 8px 12px; border-radius: 99px; display: flex; align-items: center; gap: 6px;
    }
    input[type="date"] {
      background: transparent; border: none; color: var(--text); font-weight: 800; font-size: 13px; outline: none;
    }

    /* Layout */
    .grid { display: grid; gap: 14px; }
    @media(min-width: 780px) { .grid { grid-template-columns: 1.1fr .9fr; align-items: start; } }

    .card {
      background: var(--card); border: 1px solid var(--stroke);
      border-radius: var(--r24); overflow: hidden; backdrop-filter: blur(10px);
      box-shadow: var(--shadow); margin-bottom: 14px;
    }
    .cardTitle { padding: 14px; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--stroke); }
    .cardInner { padding: 14px; }
    .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--stroke); padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,0.05); }

    /* Inputs & Buttons */
    .fieldLabel { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 2px 6px; font-weight: 800; }
    .field {
      width: 100%; padding: 14px; border-radius: 16px;
      background: rgba(0,0,0,0.25); border: 1px solid var(--stroke);
      color: white; font-size: 16px; outline: none; transition: 0.2s;
    }
    .field:focus { border-color: var(--accent); }
    .field[readonly] { background: rgba(0,0,0,0.1); opacity: 0.7; }

    .btn {
      width: 100%; padding: 14px; border-radius: 18px; border: 1px solid var(--stroke);
      font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform 0.1s;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; border: none; }
    .btn.ghost { background: rgba(255,255,255,0.05); color: var(--text); }
    .btn.danger { background: rgba(255,91,122,0.1); color: var(--danger); border-color: rgba(255,91,122,0.2); }
    
    .btnSmall { padding: 10px; font-size: 13px; }
    .btnRow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

    /* KPI */
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .kpi { background: rgba(0,0,0,0.15); padding: 12px; border-radius: 18px; border: 1px solid var(--stroke); }
    .kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .kpi .val { font-size: 19px; font-weight: 900; margin-top: 4px; }
    .kpi.net .val { color: #34d399; }

    /* Pills & Lists */
    .pill { border: 1px solid var(--stroke); background: rgba(0,0,0,0.15); border-radius: 99px; padding: 10px 14px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
    .expense-item { display: grid; grid-template-columns: 1fr 100px 44px; gap: 8px; margin-top: 8px; align-items: center; }

    /* Tabs */
    .tabs { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(7,10,20,0.85); backdrop-filter: blur(15px); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 8px; border-top: 1px solid var(--stroke); z-index: 100; }
    .tab { flex: 1; padding: 12px; border-radius: 16px; border: 1px solid transparent; background: transparent; color: var(--muted); font-weight: 800; cursor: pointer; }
    .tab.active { background: rgba(106,167,255,0.1); border-color: rgba(106,167,255,0.2); color: var(--accent); }

    .view { display: none; }
    .view.active { display: block; }

    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 12px; display: none; z-index: 1000; font-size: 14px; border: 1px solid var(--stroke); }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="wrap">
    <header class="appbar">
      <div class="brand">
        <div class="logo">TL</div>
        <div>
          <h1>Taxi Ledger</h1>
          <p>Τζίρος • Έξοδα • Backup</p>
        </div>
      </div>
      <div class="datePill">
        <span>📅</span>
        <input id="dateInput" type="date">
      </div>
    </header>

    <div class="grid">
      <main id="view-entry" class="view active">
        <div class="card">
          <div class="cardTitle">
            <span style="font-weight: 900;">Καταχώρηση</span>
            <div class="badge">Auto-save: <span id="autosaveState">έτοιμο</span></div>
          </div>

          <div class="cardInner">
            <div class="kpis">
              <div class="kpi"><div class="label">Τζίρος</div><div id="kpiRevenue" class="val">0,00 €</div></div>
              <div class="kpi"><div class="label">Extras</div><div id="kpiExtras" class="val">0,00 €</div></div>
              <div class="kpi"><div class="label">Σύνολο</div><div id="kpiTotal" class="val">0,00 €</div></div>
              <div class="kpi net"><div class="label">Καθαρά</div><div id="kpiNet" class="val">0,00 €</div></div>
            </div>

            <label class="fieldLabel">Τζίρος (€)</label>
            <input id="revenue" class="field" inputmode="decimal" type="number" step="0.01" placeholder="0.00">

            <label class="fieldLabel">Μπουρμπουάρ (€)</label>
            <input id="tip1" class="field" inputmode="decimal" type="number" step="0.01" placeholder="0.00">

            <label class="fieldLabel">Άλλα (€)</label>
            <input id="tip2" class="field" inputmode="decimal" type="number" step="0.01" placeholder="0.00">

            <label class="fieldLabel">Σύνολο Εξόδων (€)</label>
            <input id="expensesTotal" class="field" type="number" step="0.01" value="0.00" readonly>

            <button id="addExpenseBtn" class="btn ghost btnSmall" style="margin-top: 12px;">+ Προσθήκη Εξόδου</button>
            <div id="expensesList"></div>

            <label class="fieldLabel">Σημειώσεις</label>
            <input id="note" class="field" placeholder="...">

            <button id="saveBtn" class="btn primary" style="margin-top: 20px;">💾 Αποθήκευση</button>

            <div class="card" style="margin-top: 24px; background: rgba(0,0,0,0.2);">
              <div class="cardTitle" style="font-size: 13px;">Cloud Sync (Google)</div>
              <div class="cardInner">
                <div id="syncState" class="pill" style="margin-bottom: 10px; font-size: 11px;">
                  🔴 Offline • 🔓 Google: Όχι
                </div>
                <label class="pill" style="cursor:pointer; margin-bottom:10px">
                  <span>Auto-sync</span>
                  <input id="syncToggle" type="checkbox">
                </label>
                <div class="btnRow">
                  <button id="syncLoginBtn" class="btn ghost btnSmall">Σύνδεση</button>
                  <button id="syncBtn" class="btn ghost btnSmall">Sync Τώρα</button>
                </div>
                <button id="restoreBtn" class="btn danger btnSmall" style="margin-top:10px; width:100%">Επαναφορά από Cloud</button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <aside>
        <div id="view-history" class="view">
          <div class="card">
            <div class="cardTitle"><span style="font-weight: 800;">Ιστορικό</span></div>
            <div class="cardInner" id="historyList"></div>
          </div>
        </div>

        <div id="view-summary" class="view">
          <div class="card">
            <div class="cardTitle"><span style="font-weight: 800;">Σύνολα</span></div>
            <div class="cardInner" id="summaryStats">
               </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="entry">Εγγραφή</button>
    <button class="tab" data-tab="history">Ιστορικό</button>
    <button class="tab" data-tab="summary">Στατιστικά</button>
  </nav>

  <div id="toast" class="toast"></div>

  <script>
    // Tab Logic
    const tabs = document.querySelectorAll('.tab');
    const views = document.querySelectorAll('.view');
    tabs.forEach(t => {
      t.addEventListener('click', () => {
        tabs.forEach(btn => btn.classList.remove('active'));
        views.forEach(v => v.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('view-' + t.dataset.tab).classList.add('active');
      });
    });

    // Ripple Effect
    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', function(e) {
        let x = e.clientX - e.target.offsetLeft;
        let y = e.clientY - e.target.offsetTop;
        let ripple = document.createElement('span');
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>
</body>
</html>
